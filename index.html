<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kinetic Sorcery - 巫師火原素特訓</title>
    
    <!-- Google Fonts 史詩級魔法書寫風格字型 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
    
    <!-- 引入核心的顏色追蹤庫與高可用性官方 AI Face Mesh 核心與鏡頭驅動庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tracking.js/1.1.3/tracking-min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'PingFang TC', sans-serif; }
        
        /* 相機畫面全螢幕背景 */
        #webcam { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; transform: scaleX(-1); }
        
        /* 遊戲與特效主畫布 */
        #game-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        
        /* 符文石雕自適應遊戲外框 */
        #game-stone-frame {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; box-sizing: border-box;
            border-style: solid; border-width: 40px; border-image: url('stone carving.png') 250 repeat;
        }
        
        /* 初始主畫面 Cover 層 */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            background-color: #000; display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s ease;
        }
        #start-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 11; }
        #start-ui { position: relative; z-index: 12; text-align: center; pointer-events: none; width: 100%; height: 100%; }
        #start-prompt { 
            position: absolute; left: 50%; top: 61%; transform: translate(-50%, -50%); width: 100%;
            font-size: clamp(13px, 2.2vh, 20px); color: #ffd700; text-shadow: 0 0 8px #ff4500, 0 0 15px #ff0000; animation: pulseGlow 2s infinite ease-in-out; font-weight: bold; letter-spacing: 3px; margin: 0;
        }

        @keyframes pulseGlow { 0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.97); } 50% { opacity: 1; transform: translate(-50%, -50%) scale(1.03); } }

        /* 頂部引進與狀態引導 */
        #instruction { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 15; background: rgba(0,0,0,0.75); color: #fff; padding: 12px 24px; border-radius: 30px; border: 1px solid #ff4500; text-align: center; box-shadow: 0 0 15px rgba(255, 69, 0, 0.4); display: none; }
        
        /* 右下角魔法計數器 */
        #scoreboard { position: absolute; bottom: 35px; right: 35px; z-index: 15; background: rgba(0,0,0,0.8); color: #fff; padding: 15px; border-radius: 12px; border: 2px solid #00d2ff; font-weight: bold; font-size: 16px; line-height: 1.6; box-shadow: 0 0 10px rgba(0, 210, 255, 0.3); display: none; }
        .success { color: #00d2ff; }
        .failed { color: #ff4500; }

        /* 🛠️ 全新底部五頂魔法帽生命值（HP）圖示區 */
        #hat-hp-bar {
            display: none; position: absolute; bottom: 35px; left: 50%; transform: translateX(-50%); z-index: 15;
            display: flex; gap: 12px; justify-content: center; align-items: center; background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 20px; border: 1px solid #ff4500;
        }
        .hp-hat-icon { width: 35px; height: 35px; object-fit: contain; transition: all 0.3s ease; filter: drop-shadow(0 0 5px #ffd700); }
        .hp-hat-lost { opacity: 0.2; filter: grayscale(1) drop-shadow(0 0 0px transparent); transform: scale(0.8); }

        /* 全螢幕巨大倒數計時文字 */
        #countdown-overlay {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 15; font-family: 'Cinzel Decorative', Georgia, serif; font-size: 120px; font-weight: bold;
            color: #ffd700; text-shadow: 0 0 30px #ff4500, 0 0 60px #ff0000; pointer-events: none;
        }

        /* 全螢幕紅色呼吸警告層 */
        #danger-glow-screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 14; pointer-events: none; box-shadow: inset 0 0 100px rgba(255, 0, 0, 0.8); background-color: rgba(255, 0, 0, 0); }

        @keyframes redPulse {
            0% { background-color: rgba(255, 0, 0, 0.0); box-shadow: inset 0 0 60px rgba(255, 0, 0, 0.5); }
            50% { background-color: rgba(255, 0, 0, 0.3); box-shadow: inset 0 0 140px rgba(255, 0, 0, 0.95); }
            100% { background-color: rgba(255, 0, 0, 0.0); box-shadow: inset 0 0 60px rgba(255, 0, 0, 0.5); }
        }
        .pulse-effect { animation: redPulse 0.6s 2 ease-in-out; }

        /* 遊戲結束挑戰畫面 */
        #game-over-screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 40; background: rgba(0, 0, 0, 0.9); flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        #game-over-text { font-size: clamp(32px, 5vh, 56px); font-weight: bold; margin-bottom: 15px; letter-spacing: 2px; }
        #game-result-details { color: #fff; font-size: 20px; margin-bottom: 35px; line-height: 1.8; }
        #btn-reload { pointer-events: auto; background: linear-gradient(135deg, #ff4500 0%, #b30000 100%); color: #fff; font-size: 18px; font-weight: bold; padding: 14px 44px; border-radius: 30px; border: 2px solid #ffd700; box-shadow: 0 0 15px rgba(255, 69, 0, 0.6); cursor: pointer; transition: all 0.2s ease; letter-spacing: 2px; }
        #btn-reload:active { transform: scale(0.95); }

        /* 畫面受傷震動 */
        @keyframes shake {
            0% { transform: translate(2px, 2px) rotate(0deg); }
            20% { transform: translate(-3px, -1px) rotate(-1deg); }
            40% { transform: translate(-1px, 2px) rotate(1deg); }
            60% { transform: translate(3px, -2px) rotate(0deg); }
            80% { transform: translate(-2px, 1px) rotate(-1deg); }
            100% { transform: translate(0px, 0px) rotate(0deg); }
        }
        .shake-effect { animation: shake 0.3s ease-in-out; }
    </style>
</head>
<body>

    <!-- 初始主畫面 -->
    <div id="start-screen">
        <canvas id="start-canvas"></canvas>
        <div id="start-ui">
            <div id="start-prompt">─ 點擊螢幕 喚醒魔杖 ─</div>
        </div>
    </div>

    <!-- 實時鏡頭 -->
    <video id="webcam" autoplay loop muted playsinline style="display:none;"></video>
    
    <!-- 遊戲特效畫布 -->
    <canvas id="game-canvas"></canvas>

    <!-- 符文自適應外框 -->
    <div id="game-stone-frame"></div>

    <!-- 危機紅色受傷呼吸層 -->
    <div id="danger-glow-screen"></div>

    <!-- 巨大倒數計時層 -->
    <div id="countdown-overlay">III</div>

    <!-- 頂部提示 UI -->
    <div id="instruction">
        <strong id="ritual-title" style="color: #ffd700;">結界啟動中...</strong><br>
        <span id="ritual-desc" style="font-size: 13px;">請用手指在圓圈內依序滑過藍色發光點，一筆畫畫出五芒星！</span>
    </div>

    <!-- 右下角計數器 -->
    <div id="scoreboard">
        <div>成功攔截：<span id="txt-success" class="success">0</span> 次</div>
        <div>防禦失敗：<span id="txt-failed" class="failed">0</span> 次</div>
    </div>

    <!-- 🛠️ 底部五頂魔法帽生命值血條 -->
    <div id="hat-hp-bar">
        <img src="CIC-hat.PNG" class="hp-hat-icon" id="hp-hat-1">
        <img src="CIC-hat.PNG" class="hp-hat-icon" id="hp-hat-2">
        <img src="CIC-hat.PNG" class="hp-hat-icon" id="hp-hat-3">
        <img src="CIC-hat.PNG" class="hp-hat-icon" id="hp-hat-4">
        <img src="CIC-hat.PNG" class="hp-hat-icon" id="hp-hat-5">
    </div>

    <!-- 遊戲結束與重新挑戰畫面 -->
    <div id="game-over-screen">
        <div id="game-over-text">特訓結束</div>
        <div id="game-result-details"></div>
        <button id="btn-reload" onclick="resetGame()">重新挑戰</button>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('start-screen');
        const startCanvas = document.getElementById('start-canvas');
        const startCtx = startCanvas.getContext('2d');
        const gameOverScreen = document.getElementById('game-over-screen');
        const dangerGlowScreen = document.getElementById('danger-glow-screen');
        const countdownOverlay = document.getElementById('countdown-overlay');
        const stoneFrame = document.getElementById('game-stone-frame');
        const hpBar = document.getElementById('hat-hp-bar');

        let gameStarted = false;
        let scoreSuccess = 0;
        let scoreFailed = 0; // 記錄受傷扣血次數，累計滿 5 次結束
        let isGameOver = false;

        let gameState = 'cover'; 
        let countdownNumber = 3;

        // 🛠️ 載入新需求圖檔資產
        let dragonImg = new Image(); dragonImg.src = "dragon head-front.png";
        let hatImg = new Image(); hatImg.src = "CIC-hat.PNG";
        let magicCircleImg = new Image(); magicCircleImg.src = "bg.png"; 
        let bg1Img = new Image(); bg1Img.src = "bg-1.png";

        // 🛠️ 重塑中間核心物件狀態
        let dragonBoss = { x: 0, y: 50, width: 140, height: 140, speedX: 2.5, targetX: 0, state: 'move', stateTimer: 120 };
        let fireballs = []; // 支援多顆火球同時掉落滾動
        let dragonLaser = { active: false, x: 0, topY: 0, width: 35, alpha: 0 };
        let userHatAR = { x: 0, y: 0, width: 110, height: 110, tracked: false, ivX: 0, ivY: 0 };
        
        let crosshair = { x: 0, y: 0, targetX: 0, targetY: 0, rotation: 0, size: 35, hasTracking: false };
        let explosions = []; 
        let coronaParticles = [];
        let circleRotation = 0; let bg1Rotation = 0; let ritualOpacity = 1.0; 

        let pentagramPoints = []; let nextRequiredPoint = 0; let wandTrail = []; 
        let invulnerableTimer = 0; // 受傷短暫無敵免疫閃爍時間

        function resizeCanvases() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            startCanvas.width = window.innerWidth;
            startCanvas.height = window.innerHeight;
            dragonBoss.x = canvas.width / 2 - dragonBoss.width / 2;
            generatePentagramPoints();
        }
        window.addEventListener('resize', resizeCanvases);

        function generatePentagramPoints() {
            let centerX = startCanvas.width / 2;
            let minDim = Math.min(startCanvas.width, startCanvas.height);
            let circleCenterY = startCanvas.height * 0.34;
            let radius = minDim * 0.26; 
            pentagramPoints = [];
            let drawOrderAngles = [ -Math.PI/2, Math.PI*0.7, -Math.PI*0.9, Math.PI*0.3, Math.PI*0.1 ];
            for(let i=0; i<5; i++) {
                let angle = drawOrderAngles[i];
                pentagramPoints.push({ x: centerX + Math.cos(angle) * radius, y: circleCenterY + Math.sin(angle) * radius, activated: false });
            }
        }

        function handleTouchMove(e) {
            if (gameState !== 'drawing') return;
            e.preventDefault();
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            wandTrail.push({ x: clientX, y: clientY });
            if (wandTrail.length > 30) wandTrail.shift();

            let targetPt = pentagramPoints[nextRequiredPoint];
            if (targetPt) {
                let dist = Math.hypot(clientX - targetPt.x, clientY - targetPt.y);
                if (dist < 40) { 
                    targetPt.activated = true;
                    nextRequiredPoint++;
                    if (nextRequiredPoint >= 5) gameState = 'success_anim';
                }
            }
        }

        startScreen.addEventListener('mousedown', (e) => {
            if(gameState === 'cover') { gameState = 'drawing'; document.getElementById('start-prompt').style.display = 'none'; document.getElementById('instruction').style.display = 'block'; }
        });
        startScreen.addEventListener('mousemove', handleTouchMove);
        startScreen.addEventListener('touchstart', (e) => {
            if(gameState === 'cover') { gameState = 'drawing'; document.getElementById('start-prompt').style.display = 'none'; document.getElementById('instruction').style.display = 'block'; }
        }, { passive: false });
        startScreen.addEventListener('touchmove', handleTouchMove, { passive: false });

        function updateStartScreen() {
            if (gameStarted && gameState === 'playing') return;
            if (startCanvas.width !== window.innerWidth || startCanvas.height !== window.innerHeight) resizeCanvases();
            
            startCtx.fillStyle = '#000000';
            startCtx.fillRect(0, 0, startCanvas.width, startCanvas.height);
            let centerX = startCanvas.width / 2;
            let minDim = Math.min(startCanvas.width, startCanvas.height);
            let circleCenterY = startCanvas.height * 0.34;

            startCtx.save();
            startCtx.globalAlpha = ritualOpacity;

            if (gameState === 'cover' || gameState === 'success_anim') {
                if (coronaParticles.length < 120) {
                    let angle = Math.random() * Math.PI * 2;
                    let speed = Math.random() * 2 + 1.5; 
                    coronaParticles.push({
                        x: centerX + Math.cos(angle) * (minDim * 0.25), y: circleCenterY + Math.sin(angle) * (minDim * 0.25),
                        vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                        life: Math.random() * 30 + 20, maxLife: 50, size: Math.random() * 25 + 15
                    });
                }
                startCtx.save();
                startCtx.globalCompositeOperation = 'screen';
                for (let i = coronaParticles.length - 1; i >= 0; i--) {
                    let p = coronaParticles[i]; p.x += p.vx; p.y += p.vy; p.life--;
                    if (p.life <= 0) { coronaParticles.splice(i, 1); continue; }
                    let ratio = p.life / p.maxLife;
                    let grad = startCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
                    grad.addColorStop(0, 'rgba(255, 230, 150, ' + ratio + ')');
                    grad.addColorStop(0.3, 'rgba(255, 90, 0, ' + ratio * 0.8 + ')');
                    grad.addColorStop(1, 'rgba(0,0,0,0)');
                    startCtx.beginPath(); startCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    startCtx.fillStyle = grad; startCtx.fill();
                }
                startCtx.restore();
            }

            let fixedSize = minDim * 0.58;
            if (gameState === 'cover') {
                startCtx.save(); startCtx.translate(centerX, circleCenterY); circleRotation += 0.004; startCtx.rotate(circleRotation);
                if (magicCircleImg.complete) startCtx.drawImage(magicCircleImg, -fixedSize / 2, -fixedSize / 2, fixedSize, fixedSize);
                startCtx.restore();
            } 
            else if (gameState === 'drawing') {
                startCtx.save(); startCtx.translate(centerX, circleCenterY); bg1Rotation -= 0.002; startCtx.rotate(bg1Rotation);
                if (bg1Img.complete) startCtx.drawImage(bg1Img, -fixedSize / 2, -fixedSize / 2, fixedSize, fixedSize);
                startCtx.restore();

                if (wandTrail.length > 1) {
                    startCtx.save();
                    startCtx.strokeStyle = 'rgba(0, 210, 255, 0.4)'; startCtx.lineWidth = 8; startCtx.lineCap = 'round'; startCtx.lineJoin = 'round';
                    startCtx.beginPath(); startCtx.moveTo(wandTrail[0].x, wandTrail[0].y);
                    for(let k=1; k<wandTrail.length; k++) startCtx.lineTo(wandTrail[k].x, wandTrail[k].y);
                    startCtx.stroke();
                    startCtx.strokeStyle = '#ffffff'; startCtx.lineWidth = 3;
                    startCtx.beginPath(); startCtx.moveTo(wandTrail[0].x, wandTrail[0].y);
                    for(let k=1; k<wandTrail.length; k++) startCtx.lineTo(wandTrail[k].x, wandTrail[k].y);
                    startCtx.stroke(); startCtx.restore();
                }

                pentagramPoints.forEach((pt, index) => {
                    startCtx.save();
                    let isCurrent = (index === nextRequiredPoint);
                    if (pt.activated) {
                        startCtx.fillStyle = '#00ffff'; startCtx.beginPath(); startCtx.arc(pt.x, pt.y, 9, 0, Math.PI * 2); startCtx.fill();
                    } else if (isCurrent) {
                        let breath = Math.sin(Date.now() * 0.008) * 2;
                        startCtx.fillStyle = '#0077ff'; startCtx.beginPath(); startCtx.arc(pt.x, pt.y, 11 + breath, 0, Math.PI * 2); startCtx.fill();
                        startCtx.strokeStyle = '#ffffff'; startCtx.lineWidth = 1.5; startCtx.beginPath(); startCtx.arc(pt.x, pt.y, 14 + breath, 0, Math.PI * 2); startCtx.stroke();
                    } else {
                        startCtx.fillStyle = 'rgba(0, 119, 255, 0.3)'; startCtx.beginPath(); startCtx.arc(pt.x, pt.y, 8, 0, Math.PI * 2); startCtx.fill();
                    }
                    startCtx.restore();
                });
            } 
            else if (gameState === 'success_anim') {
                circleRotation += 0.06; bg1Rotation -= 0.04;   
                startCtx.save(); startCtx.translate(centerX, circleCenterY); startCtx.rotate(bg1Rotation);
                if (bg1Img.complete) startCtx.drawImage(bg1Img, -fixedSize / 2, -fixedSize / 2, fixedSize, fixedSize);
                startCtx.restore();
                startCtx.save(); startCtx.translate(centerX, circleCenterY); startCtx.rotate(circleRotation);
                startCtx.shadowBlur = 40; startCtx.shadowColor = '#ffd700'; 
                if (magicCircleImg.complete) startCtx.drawImage(magicCircleImg, -fixedSize / 2, -fixedSize / 2, fixedSize, fixedSize);
                startCtx.restore();

                ritualOpacity -= 0.02;
                if (ritualOpacity <= 0) {
                    ritualOpacity = 0; startScreen.style.display = 'none';
                    triggerCountdown(); 
                }
            }

            if (gameState === 'cover' || gameState === 'drawing') {
                startCtx.save();
                let dynamicFontSize = Math.min(36, Math.max(18, minDim * 0.062));
                startCtx.font = `bold ${dynamicFontSize}px 'Cinzel Decorative', Georgia, serif`;
                startCtx.textAlign = "center"; startCtx.textBaseline = "middle"; startCtx.letterSpacing = "2px";
                startCtx.lineWidth = 2; startCtx.strokeStyle = "#000000";
                startCtx.strokeText("KINETIC SORCERY", centerX, startCanvas.height * 0.71);
                startCtx.fillStyle = "#ffcc00"; startCtx.fillText("KINETIC SORCERY", centerX, startCanvas.height * 0.71);
                startCtx.restore();
            }

            startCtx.restore();
            requestAnimationFrame(updateStartScreen);
        }

        function triggerCountdown() {
            gameState = 'countdown';
            countdownOverlay.style.display = 'block';
            document.getElementById('ritual-title').innerText = "遠古巨龍降臨：結界充能完畢";
            document.getElementById('ritual-title').style.color = "#00d2ff";
            document.getElementById('ritual-desc').innerText = "AI 臉部追蹤定位中，請對準相機...";
            
            initARAndTrackerEngines();

            const romanNumerals = ["", "I", "II", "III"];
            let timer = setInterval(() => {
                countdownNumber--;
                if (countdownNumber > 0) {
                    countdownOverlay.innerText = romanNumerals[countdownNumber];
                } else {
                    clearInterval(timer);
                    countdownOverlay.style.display = 'none';
                    document.getElementById('scoreboard').style.display = 'block';
                    hpBar.style.display = 'flex'; // 顯示血條
                    stoneFrame.style.display = 'block'; // 顯示外框
                    
                    document.getElementById('ritual-title').innerText = "巫師火原素特訓：巨龍逆襲頭目戰";
                    document.getElementById('ritual-title').style.color = "#ff4500";
                    document.getElementById('ritual-desc').innerHTML = '擊落滾落火球！當巨龍停下時，請<span style="color:#ffd700;font-weight:bold;">擺動身體閃避</span>火焰射線！';
                    
                    gameState = 'playing';
                    gameStarted = true;
                }
            }, 1000);
        }

        let enginesInitialized = false;
        function initARAndTrackerEngines() {
            if (enginesInitialized) return;
            enginesInitialized = true;

            // 1. 初始化人臉追蹤（帽子追蹤）
            const faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
            faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
            faceMesh.onResults(onARFaceMeshResults);

            const camera = new Camera(video, {
                onFrame: async () => { await faceMesh.send({ image: video }); },
                width: 640, height: 480
            });
            camera.start();

            // 2. 初始化魔杖紅色追蹤（擊落火球）
            tracking.ColorTracker.registerColor('magic_red', function(r, g, b) {
                return (r > 165 && g < 55 && b < 55); 
            });
            const colorTracker = new tracking.ColorTracker(['magic_red']);
            colorTracker.setMinDimension(7);
            colorTracker.on('track', function(event) {
                if (isGameOver || event.data.length === 0 || gameState !== 'playing') {
                    crosshair.hasTracking = false;
                    return;
                }
                let validTarget = event.data[0];
                crosshair.hasTracking = true;
                crosshair.targetX = canvas.width - (validTarget.x + validTarget.width / 2) * (canvas.width / 640);
                crosshair.targetY = (validTarget.y + validTarget.height / 2) * (canvas.height / 480);
            });
            tracking.track('#webcam', colorTracker);
        }

        // 🛠️ 魔法帽即時 AR 追蹤
        function onARFaceMeshResults(results) {
            if (isGameOver || !results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
                userHatAR.tracked = false;
                return;
            }
            const landmarks = results.multiFaceLandmarks[0];

            let scaleX = canvas.width;
            let scaleY = canvas.height;

            // 抓取額頭上方中央點（Landmark 10）與頭頂邊緣（Landmark 152作為比例基準參考）
            let forehead = landmarks[10];
            
            // 計算 Canvas 上的映射座標（因視訊有左右鏡像，X軸需做對稱轉換）
            userHatAR.tracked = true;
            userHatAR.ivX = (1 - forehead.x) * scaleX;
            userHatAR.ivY = forehead.y * scaleY - (canvas.height * 0.12); // 將帽子往頭頂上方位移
        }

        function createExplosion(x, y, isLaser = false) {
            let count = isLaser ? 8 : 20;
            for (let i = 0; i < count; i++) {
                explosions.push({
                    x: x, y: y, vx: (Math.random() - 0.5) * (isLaser ? 6 : 12), vy: (Math.random() - 0.5) * (isLaser ? 6 : 12),
                    size: Math.random() * 5 + 2, alpha: 1,
                    color: isLaser ? `hsl(${Math.random() * 20 + 10}, 100%, 75%)` : `hsl(${Math.random() * 30 + 15}, 100%, 60%)`
                });
            }
        }

        // 🛠️ 處理巨龍 Boss 的行為狀態機
        function handleDragonBossAI() {
            dragonBoss.stateTimer--;

            if (dragonBoss.state === 'move') {
                // 左右平移移動
                dragonBoss.x += dragonBoss.speedX;
                if (dragonBoss.x <= 40 || dragonBoss.x >= canvas.width - dragonBoss.width - 40) {
                    dragonBoss.speedX *= -1;
                }

                // 移動時機率性掉落火球
                if (dragonBoss.stateTimer % 28 === 0 && fireballs.length < 5) {
                    fireballs.push({
                        x: dragonBoss.x + dragonBoss.width / 2,
                        y: dragonBoss.y + dragonBoss.height * 0.7,
                        size: 15,
                        speedY: Math.random() * 2 + 2.5, // 垂直向下滾落
                        active: true
                    });
                }

                // 時間到，巨龍隨機停下準備發射火焰
                if (dragonBoss.stateTimer <= 0) {
                    dragonBoss.state = 'pre_laser';
                    dragonBoss.stateTimer = 45; // 蓄力警告時間
                }
            } 
            else if (dragonBoss.state === 'pre_laser') {
                // 蓄力狀態：巨龍原地顫抖警告
                dragonBoss.x += (Math.random() - 0.5) * 3;
                if (dragonBoss.stateTimer <= 0) {
                    dragonBoss.state = 'laser';
                    dragonBoss.stateTimer = 100; // 持續噴火時間
                    dragonLaser.active = true;
                    dragonLaser.x = dragonBoss.x + dragonBoss.width / 2;
                    dragonLaser.topY = dragonBoss.y + dragonBoss.height * 0.7;
                }
            } 
            else if (dragonBoss.state === 'laser') {
                // 噴射火焰狀態
                dragonLaser.x = dragonBoss.x + dragonBoss.width / 2;
                if (dragonBoss.stateTimer <= 0) {
                    dragonBoss.state = 'move';
                    dragonBoss.stateTimer = Math.random() * 100 + 100;
                    dragonLaser.active = false;
                }
            }
        }

        // 🛠️ 觸發受傷扣血機制
        function triggerPlayerDamage() {
            if (invulnerableTimer > 0) return; // 處於無敵防護時間則不重複扣血

            scoreFailed++;
            invulnerableTimer = 60; // 觸發 60 幀的無敵閃爍時間

            // 更新底部魔法帽血條 UI
            let lostHat = document.getElementById(`hp-hat-${6 - scoreFailed}`);
            if (lostHat) lostHat.classList.add('pulse-effect', 'hp-hat-lost');

            // 畫面受傷特效震動與紅色呼吸警告層
            document.body.classList.add('shake-effect');
            dangerGlowScreen.style.display = 'block';
            dangerGlowScreen.classList.add('pulse-effect');

            setTimeout(() => {
                document.body.classList.remove('shake-effect');
                dangerGlowScreen.style.display = 'none';
                dangerGlowScreen.classList.remove('pulse-effect');
            }, 600);

            if (scoreFailed >= 5) {
                triggerGameOver();
            }
        }

        function gameLoop() {
            if (canvas.width !== window.innerWidth || canvas.height !== window.innerHeight) resizeCanvases();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. 繪製相機鏡像背景
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                ctx.save(); ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height); ctx.restore();
            }

            if (gameStarted && !isGameOver) {
                if (invulnerableTimer > 0) invulnerableTimer--;

                // 魔杖準星平滑移動
                crosshair.x += (crosshair.targetX - crosshair.x) * 0.45;
                crosshair.y += (crosshair.targetY - crosshair.y) * 0.45;

                // 帽子隨人臉平滑跟隨
                userHatAR.x += (userHatAR.ivX - userHatAR.x) * 0.6;
                userHatAR.y += (userHatAR.ivY - userHatAR.y) * 0.6;

                // 2. 驅動巨龍 Boss 運算
                handleDragonBossAI();

                // 3. 繪製持續火焰射線
                if (dragonLaser.active) {
                    ctx.save();
                    ctx.globalCompositeOperation = 'screen';
                    let grad = ctx.createLinearGradient(dragonLaser.x, dragonLaser.topY, dragonLaser.x, canvas.height);
                    grad.addColorStop(0, '#ffffff');
                    grad.addColorStop(0.2, '#ffea00');
                    grad.addColorStop(0.6, '#ff5100');
                    grad.addColorStop(1, 'rgba(255,0,0,0)');
                    
                    ctx.fillStyle = grad;
                    let laserW = dragonLaser.width + Math.sin(Date.now() * 0.05) * 6; // 動態火焰顫抖感
                    ctx.fillRect(dragonLaser.x - laserW / 2, dragonLaser.topY, laserW, canvas.height - dragonLaser.topY);
                    
                    // 火焰粒子微粒效果
                    if (Math.random() < 0.6) createExplosion(dragonLaser.x + (Math.random() - 0.5) * 20, Math.random() * (canvas.height - dragonLaser.topY) + dragonLaser.topY, true);
                    ctx.restore();

                    // 🔥 【火焰碰撞判定】：檢查火焰射線是否燒到玩家頭頂的 AR 魔法帽
                    if (userHatAR.tracked && invulnerableTimer === 0) {
                        let hatLeft = userHatAR.x - userHatAR.width / 2;
                        let hatRight = userHatAR.x + userHatAR.width / 2;
                        // 火焰是一條垂直向下的射線，只要帽子的橫向範圍與火焰射線重疊，且高度在射線下方，即算燒到
                        if (hatLeft < (dragonLaser.x + laserW/2) && hatRight > (dragonLaser.x - laserW/2) && userHatAR.y > dragonLaser.topY) {
                            triggerPlayerDamage();
                        }
                    }
                }

                // 4. 繪製並更新掉落的火球群
                for (let i = fireballs.length - 1; i >= 0; i--) {
                    let fb = fireballs[i];
                    if (!fb.active) { fireballs.splice(i, 1); continue; }

                    fb.y += fb.speedY; // 火球垂直滾落

                    ctx.save();
                    let grad = ctx.createRadialGradient(fb.x, fb.y, fb.size * 0.1, fb.x, fb.y, fb.size);
                    grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.3, '#ffcc00'); grad.addColorStop(0.6, '#ff4500'); grad.addColorStop(1, 'rgba(255,69,0,0)');
                    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(fb.x, fb.y, fb.size, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();

                    // 💥 【魔杖擊落判定】：檢查追蹤準星是否碰觸到火球
                    if (crosshair.hasTracking) {
                        let distance = Math.hypot(crosshair.x - fb.x, crosshair.y - fb.y);
                        if (distance < (fb.size + crosshair.size)) {
                            scoreSuccess++;
                            createExplosion(fb.x, fb.y);
                            fb.active = false;
                            continue;
                        }
                    }

                    // 如果火球滾落超過螢幕底部，安全消失（火球沒擊落不扣血，火焰燒到帽子才扣血）
                    if (fb.y > canvas.height + 50) {
                        fb.active = false;
                    }
                }

                // 5. 繪製巨龍 Boss
                if (dragonImg.complete) {
                    ctx.save();
                    // 蓄力噴火前身體震動警告特效
                    let offsetX = (dragonBoss.state === 'pre_laser') ? (Math.random() - 0.5) * 5 : 0;
                    ctx.drawImage(dragonImg, dragonBoss.x + offsetX, dragonBoss.y, dragonBoss.width, dragonBoss.height);
                    ctx.restore();
                }

                // 6. 繪製 AR 魔法帽子（受傷無敵時間會產生閃爍效果）
                if (userHatAR.tracked && hatImg.complete) {
                    if (invulnerableTimer === 0 || Math.floor(invulnerableTimer / 4) % 2 === 0) {
                        ctx.save();
                        ctx.drawImage(hatImg, userHatAR.x - userHatAR.width / 2, userHatAR.y - userHatAR.height / 2, userHatAR.width, userHatAR.height);
                        ctx.restore();
                    }
                }

                // 7. 更新並繪製爆炸粒子
                for (let i = explosions.length - 1; i >= 0; i--) {
                    let p = explosions[i]; p.x += p.vx; p.y += p.vy; p.alpha -= 0.03;
                    if (p.alpha <= 0) { explosions.splice(i, 1); continue; }
                    ctx.save(); ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = p.color; ctx.globalAlpha = p.alpha; ctx.fill(); ctx.restore();
                }

                // 8. 繪製魔杖追蹤準星
                if (crosshair.hasTracking) {
                    crosshair.rotation += 0.04;
                    ctx.save(); ctx.translate(crosshair.x, crosshair.y); ctx.rotate(crosshair.rotation);
                    ctx.lineWidth = 2; ctx.strokeStyle = '#00d2ff'; ctx.shadowBlur = 4; ctx.shadowColor = '#00d2ff';
                    ctx.beginPath(); ctx.arc(0, 0, crosshair.size, 0, Math.PI * 2); ctx.setLineDash([6, 6]); ctx.stroke();
                    ctx.restore();
                }
            }
            requestAnimationFrame(gameLoop);
        }

        function triggerGameOver() {
            isGameOver = true;
            gameStarted = false;
            dragonLaser.active = false;
            fireballs = [];
            
            let details = document.getElementById('game-result-details');
            let mainTxt = document.getElementById('game-over-text');
            
            details.innerHTML = `成功攔截火球：<span style="color:#00d2ff; font-weight:bold;">${scoreSuccess}</span> 次<br>累計受傷扣血：<span style="color:#ff4500; font-weight:bold;">${scoreFailed}</span> 次`;
            
            // 保留原本的魔法師評價機制
            if (scoreSuccess >= 25) {
                mainTxt.innerText = "特訓評價：大魔法師"; mainTxt.style.color = "#ffd700"; mainTxt.style.textShadow = "0 0 20px #ffd700";
            } else if (scoreSuccess >= 12) {
                mainTxt.innerText = "特訓評價：合格巫師"; mainTxt.style.color = "#00d2ff"; mainTxt.style.textShadow = "0 0 20px #00d2ff";
            } else {
                mainTxt.innerText = "特訓評價：魔法學徒"; mainTxt.style.color = "#ff3333"; mainTxt.style.textShadow = "0 0 20px #ff3333";
            }
            gameOverScreen.style.display = 'flex';
        }

        function resetGame() {
            scoreSuccess = 0;
            scoreFailed = 0;
            isGameOver = false;
            gameStarted = false;
            countdownNumber = 3;
            nextRequiredPoint = 0;
            ritualOpacity = 1.0;
            startCtx.globalAlpha = 1.0;
            invulnerableTimer = 0;
            
            wandTrail = [];
            fireballs = [];
            dragonLaser.active = false;
            dragonBoss.state = 'move';
            dragonBoss.stateTimer = 120;
            
            countdownOverlay.innerText = "III";
            dangerGlowScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            
            // 重置底部血條魔法帽樣式
            for (let i = 1; i <= 5; i++) {
                let hat = document.getElementById(`hp-hat-${i}`);
                if (hat) hat.className = 'hp-hat-icon';
            }

            pentagramPoints.forEach(pt => pt.activated = false);
            explosions = [];

            gameState = 'cover';
            startScreen.style.opacity = "1";
            startScreen.style.display = 'flex';
            document.getElementById('start-prompt').style.display = 'block';
            document.getElementById('instruction').style.display = 'none';
            document.getElementById('scoreboard').style.display = 'none';
            hpBar.style.display = 'none';
            stoneFrame.style.display = 'none';
            resizeCanvases();
        }

        resizeCanvases();
        updateStartScreen();
        gameLoop();
    </script>
</body>
</html>
